name: Deploy GitHub Pages (Static TNWW)

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"
  push:
    branches: ["main"]
    paths:
      - "api/**"
      - "config/**"
      - "widget/**"
      - ".github/workflows/pages-static.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-static"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "widget/package-lock.json"

      - name: Install API deps
        run: python -m pip install --upgrade pip && python -m pip install -e ./api

      - name: Generate static API payloads
        env:
          TNWW_CONFIG_DIR: ${{ github.workspace }}/config
          TNWW_SQLITE_PATH: ${{ runner.temp }}/tnww.sqlite
          TNWW_TIMEZONE: America/Chicago
          TNWW_OPENMETEO_LAT: "36.0598"
          TNWW_OPENMETEO_LON: "-86.8291"
        run: python api/scripts/export_static_api.py --output-dir widget/public/static-api

      - name: Install widget deps
        working-directory: widget
        run: npm ci

      - name: Build widget
        working-directory: widget
        run: npm run build

      - name: Commit refreshed static payloads and built Pages assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add widget/public/static-api widget/dist
          if git diff --cached --quiet; then
            echo "No generated asset changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh Pages data and assets [skip ci]"
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: widget/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
